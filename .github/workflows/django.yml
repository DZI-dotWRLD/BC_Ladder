name: Django CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Check patch whitespace
        run: git show --format= --check HEAD

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run production deployment checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-deploy-check-secret-A7mQ9vR2xT6pL4sN8wY3zB5cD1eF0gH"
          DJANGO_ALLOWED_HOSTS: "bc-ladder.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "300"
          DATABASE_URL: postgresql://bc_ladder:bc_ladder@localhost:5432/bc_ladder_deploy_check
        run: python manage.py check --deploy

      - name: Verify static collection
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-deploy-check-secret-A7mQ9vR2xT6pL4sN8wY3zB5cD1eF0gH"
          DJANGO_ALLOWED_HOSTS: "bc-ladder.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "300"
          DATABASE_URL: postgresql://bc_ladder:bc_ladder@localhost:5432/bc_ladder_deploy_check
        run: python manage.py collectstatic --noinput --clear

  sqlite:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --noinput

      - name: Run Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bc_ladder_ci
          POSTGRES_USER: bc_ladder
          POSTGRES_PASSWORD: bc_ladder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bc_ladder -d bc_ladder_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: bc_ladder_ci
      DJANGO_DB_USER: bc_ladder
      DJANGO_DB_PASSWORD: bc_ladder
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --noinput

      - name: Run Django checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: sqlite:////tmp/bc-ladder-frontend-ci.sqlite3
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          (cd tests/frontend && npm ci)
          tests/frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare disposable demo database
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo > /dev/null
      - name: Run browser regression checks
        run: |
          mkdir -p output/playwright/ci
          python manage.py runserver 127.0.0.1:8001 --noreload > output/playwright/ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/frontend/check.mjs
      - name: Upload browser screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: output/playwright/ci/
          retention-days: 7
