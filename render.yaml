services:
  - type: web
    name: bc-ladder
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "300"
      - key: DJANGO_LOG_LEVEL
        value: INFO

databases:
  - name: bc-ladder-db
    databaseName: bc_ladder
    user: bc_ladder
    plan: free
    postgresMajorVersion: "17"
