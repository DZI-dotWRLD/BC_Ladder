services:
  - type: web
    name: bc-ladder
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 30 --max-requests 500 --max-requests-jitter 50
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "300"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        value: smtp.gmail.com
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_USE_TLS
        value: "true"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: DJANGO_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: DJANGO_NOTIFICATION_DELIVERY_MODE
        value: scheduled

  - type: cron
    name: bc-ladder-notification-delivery
    runtime: python
    plan: 0.5c-512mb
    schedule: "* * * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py send_notification_emails --retry-failed
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: bc-ladder.invalid
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        value: smtp.gmail.com
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_USE_TLS
        value: "true"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_NOTIFICATION_DELIVERY_MODE
        value: scheduled

  - type: cron
    name: bc-ladder-suggestion-expiry
    runtime: python
    plan: 0.5c-512mb
    schedule: "*/5 * * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py expire_suggestions
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: bc-ladder.invalid
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"

  - type: cron
    name: bc-ladder-integrity-audit
    runtime: python
    plan: 0.5c-512mb
    schedule: "0 2 * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py audit_data_integrity
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: bc-ladder.invalid
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"

  - type: cron
    name: bc-ladder-rate-limit-purge
    runtime: python
    plan: 0.5c-512mb
    schedule: "30 2 * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python manage.py purge_rate_limit_events
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: bc-ladder.invalid
      - key: DATABASE_URL
        fromDatabase:
          name: bc-ladder-db
          property: connectionString
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"

databases:
  - name: bc-ladder-db
    databaseName: bc_ladder
    user: bc_ladder
    plan: free
    postgresMajorVersion: "17"
