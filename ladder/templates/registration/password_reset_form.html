{% extends "ladder/base.html" %}

{% block title %}Reset password | BC Ladder{% endblock %}

{% block content %}
<section class="panel">
    <h1>Reset your password</h1>
    <p class="muted">Enter the email address on your account. We will send you a secure link to choose a new password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
    <p class="muted"><a href="{% url 'ladder:login' %}">Return to login</a></p>
</section>
{% endblock %}
