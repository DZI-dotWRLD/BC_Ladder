{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Results pages">
    {% if page_obj.has_previous %}<a class="button secondary" href="?page={{ page_obj.previous_page_number }}">Previous page</a>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="button secondary" href="?page={{ page_obj.next_page_number }}">Next page</a>{% endif %}
</nav>
{% endif %}
