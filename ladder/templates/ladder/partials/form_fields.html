{% if form.non_field_errors %}<div class="form-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<div class="field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
    {% if field.help_text %}<div class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
